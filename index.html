<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aarohi · My Picks</title>
  <meta name="description" content="My favorite finds and recommendations">
  <style>
    :root {
      --bg: #faf7f5;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #e11d48;
      --accent-text: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.05);
      --amazon: #ff9900;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #fafaf9;
        --muted: #a8a29e;
        --border: #292524;
        --accent: #fb7185;
        --accent-text: #0c0a09;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c0a09;
      --card: #1c1917;
      --text: #fafaf9;
      --muted: #a8a29e;
      --border: #292524;
      --accent: #fb7185;
      --accent-text: #0c0a09;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 20px 40px;
    }

    /* ---------- Profile ---------- */
    .profile {
      text-align: center;
      margin-bottom: 40px;
    }
    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
      background: var(--card);
      display: block;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .bio {
      color: var(--muted);
      margin: 0 auto 18px;
      max-width: 420px;
    }
    .ig-btn {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: border-color 0.15s, transform 0.15s;
    }
    .ig-btn:hover,
    .ig-btn:focus-visible {
      border-color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }

    /* ---------- Section heading ---------- */
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 16px;
      text-align: center;
    }

    /* ---------- Product cards ---------- */
    .picks {
      display: grid;
      gap: 16px;
    }
    .pick {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.15s;
    }
    .pick:hover,
    .pick:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      outline: none;
    }
    .pick-img {
      flex: 0 0 96px;
      width: 96px;
      height: 96px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      overflow: hidden;
    }
    .pick-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pick-body {
      flex: 1;
      min-width: 0;
    }
    .pick-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .pick-title {
      font-weight: 650;
      font-size: 1rem;
      margin: 0 0 4px;
    }
    .pick-desc {
      color: var(--muted);
      font-size: 0.875rem;
      margin: 0 0 10px;
    }
    .pick-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent);
      padding: 7px 14px;
      border-radius: 999px;
    }

    /* ---------- Disclosure & footer ---------- */
    .disclosure {
      margin-top: 40px;
      padding: 14px 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 24px;
    }

    @media (max-width: 420px) {
      .pick { flex-direction: column; text-align: center; }
      .pick-img { flex: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="profile">
      <img class="avatar" id="avatar" src="" alt="">
      <h1 id="name"></h1>
      <p class="bio" id="bio"></p>
      <a class="ig-btn" id="insta" target="_blank" rel="noopener">Follow on Instagram</a>
    </header>

    <h2 class="section-title">My Picks</h2>
    <section class="picks" id="picks"></section>

    <div class="disclosure">
      As an Amazon Associate I earn from qualifying purchases. Prices and availability are shown on Amazon and may change.
    </div>

    <footer>© <span id="year"></span> Aarohi</footer>
  </div>

  <script>
    // ====== EDIT THIS SECTION ======
    const profile = {
      name: "Aarohi",
      bio: "Everyday finds I actually use, tested and loved. Here are my favorites. ✨",
      avatar: "avatar.jpg",               // photo next to this file, or a full image URL
      instagram: "https://www.instagram.com/its.aarohi132/",
    };

    // Add one object per product. Leave "image" empty to show the emoji instead.
    const picks = [
      {
        tag: "Top pick",
        title: "Ring Light with Tripod",
        desc: "Soft, even lighting for reels, selfies, and video calls.",
        emoji: "💡",
        image: "",
        url: "https://www.amazon.com/s?k=ring+light+with+tripod&tag=yourtag-20"
      },
      {
        tag: "Beauty",
        title: "Hydrating Skincare Set",
        desc: "My everyday routine in three simple steps.",
        emoji: "🧴",
        image: "",
        url: "https://www.amazon.com/s?k=hydrating+skincare+set&tag=yourtag-20"
      },
      {
        tag: "Home",
        title: "Minimalist Desk Organizer",
        desc: "Keeps my workspace clean and my pens in reach.",
        emoji: "🗂️",
        image: "",
        url: "https://www.amazon.com/s?k=desk+organizer&tag=yourtag-20"
      },
      {
        tag: "Tech",
        title: "Wireless Earbuds",
        desc: "Great sound and battery life for the gym and commute.",
        emoji: "🎧",
        image: "",
        url: "https://www.amazon.com/s?k=wireless+earbuds&tag=yourtag-20"
      },
      {
        tag: "Fashion",
        title: "Classic White Sneakers",
        desc: "Clean, comfortable, and goes with everything.",
        emoji: "👟",
        image: "",
        url: "https://www.amazon.com/s?k=white+sneakers&tag=yourtag-20"
      },
      {
        tag: "Kitchen",
        title: "Stainless Steel Water Bottle",
        desc: "Keeps drinks cold all day. I bring mine everywhere.",
        emoji: "🥤",
        image: "",
        url: "https://www.amazon.com/s?k=stainless+steel+water+bottle&tag=yourtag-20"
      }
    ];
    // ===============================

    document.getElementById("name").textContent = profile.name;
    document.getElementById("bio").textContent = profile.bio;
    document.getElementById("year").textContent = new Date().getFullYear();

    const avatar = document.getElementById("avatar");
    avatar.src = profile.avatar;
    avatar.alt = profile.name;

    const insta = document.getElementById("insta");
    insta.href = profile.instagram;

    const list = document.getElementById("picks");
    picks.forEach(p => {
      const a = document.createElement("a");
      a.className = "pick";
      a.href = p.url;
      // Affiliate links: open in a new tab, and tell search engines they are sponsored
      a.target = "_blank";
      a.rel = "sponsored nofollow noopener";

      const img = document.createElement("div");
      img.className = "pick-img";
      if (p.image) {
        const i = document.createElement("img");
        i.src = p.image;
        i.alt = p.title;
        img.appendChild(i);
      } else {
        img.textContent = p.emoji;
      }

      const body = document.createElement("div");
      body.className = "pick-body";

      const tag = document.createElement("span");
      tag.className = "pick-tag";
      tag.textContent = p.tag;

      const title = document.createElement("h3");
      title.className = "pick-title";
      title.textContent = p.title;

      const desc = document.createElement("p");
      desc.className = "pick-desc";
      desc.textContent = p.desc;

      const cta = document.createElement("span");
      cta.className = "pick-cta";
      cta.textContent = "Shop on Amazon →";

      body.append(tag, title, desc, cta);
      a.append(img, body);
      list.appendChild(a);
    });
  </script>
</body>
</html>
